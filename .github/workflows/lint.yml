name: Auto Linter
on:
  push:
    paths: "*.py"
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/clone the code
        uses: actions/checkout@v7 
            
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  
          
      - name: Install Linter
        run: pip install ruff
        
      - name: Run Ruff auto-fix
        run: ruff check . --fix  
      
      - name: Check the files for linting
        run: ruff check .
